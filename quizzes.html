<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quizzes - PodClass</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f7f7ff;padding-bottom:80px}header{background:#7c3aed;color:white;padding:18px 15px;position:sticky;top:0}.school-name{font-size:14px;font-weight:800;text-align:center;text-transform:uppercase;margin-bottom:12px}nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}nav a{color:white;text-decoration:none;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,0.15);font-size:13px;font-weight:600}nav a.active{background:#4c1d95}.container{max-width:800px;margin:0 auto;padding:20px}h1{text-align:center;color:#7c3aed}.login-box{background:white;padding:25px;border-radius:18px;text-align:center;margin:20px 0}.login-box input{width:100%;padding:14px;border:1.5px solid #ddd;border-radius:10px;margin:10px 0}.teacher-box{background:#ede9fe;padding:20px;border-radius:16px;border:2px dashed #7c3aed;margin:20px 0;display:none}.input-group input{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin:5px 0}.btn{background:#7c3aed;color:white;border:none;padding:14px;border-radius:10px;width:100%;font-weight:700;cursor:pointer}.quiz-box{background:white;padding:25px;border-radius:18px}.question{margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:15px}.result-box{display:none;background:#d1fae5;border:2px solid #10b981;padding:20px;border-radius:16px;text-align:center;margin-top:20px}footer{background:#1e1e2d;color:white;text-align:center;padding:25px;font-size:13px;margin-top:30px}</style></head><body>
<header><div class="school-name">FEDERAL UNIVERSITY OYE-EKITI</div><nav><a href="index.html">🏠 Home</a><a href="lessons.html">📖 Lessons</a><a href="podcasts.html">🎙️ Podcasts</a><a href="quizzes.html" class="active">📋 Quizzes</a><a href="progress.html">📊 Progress</a></nav></header>
<div class="container"><h1>📋 Quizzes</h1>
<div class="login-box" id="login"><h3>👩‍🏫 Teacher Login</h3><input type="password" id="pass" placeholder="Enter Password"><button class="btn" onclick="login()">Login</button></div>
<div class="teacher-box" id="panel"><h3>Set Quiz</h3><input type="text" id="qTitle" placeholder="Quiz Title"><div id="qBuilder"></div><button class="btn" style="background:#10b981" onclick="addQ()">+ Add Question</button><button class="btn" onclick="publish()">📤 Publish Quiz</button></div>
<h2 style="margin:20px 0">📝 Student: Take Quiz</h2><form class="quiz-box" id="form"><div id="studentArea">No quiz yet</div><button type="button" class="btn" id="submitBtn" style="display:none" onclick="submit()">Submit Quiz</button><div class="result-box" id="result"><h2 id="score"></h2></div></form></div>
<footer><b>👤 ADEBISI TAIWO LATIFAT</b> Researcher<br><b>👥 DR. ADEGBOYEGA, S.M.</b> Supervisor</footer>
<script>const P="podclass300L";let qc=0,qd=[];function login(){if(document.getElementById('pass').value===P){document.getElementById('panel').style.display="block";document.getElementById('login').style.display="none";addQ()}else alert("Wrong Password")}
function addQ(){qc++;document.getElementById('qBuilder').innerHTML+=`<div style="background:white;padding:15px;border-radius:10px;margin:10px 0"><input id="q${qc}_t" placeholder="Question ${qc}"><input id="q${qc}_a" placeholder="Option A"><input id="q${qc}_b" placeholder="Option B"><input id="q${qc}_c" placeholder="Option C"><input id="q${qc}_ans" placeholder="Correct: a,b,c"></div>`}
function publish(){qd=[];for(let i=1;i<=qc;i++){qd.push({q:document.getElementById(`q${i}_t`).value,a:document.getElementById(`q${i}_a`).value,b:document.getElementById(`q${i}_b`).value,c:document.getElementById(`q${i}_c`).value,ans:document.getElementById(`q${i}_ans`).value})}localStorage.setItem('podclass_quizData',JSON.stringify(qd));render()}
function render(){let d=JSON.parse(localStorage.getItem('podclass_quizData')||'[]');let h="";d.forEach((x,i)=>{h+=`<div class="question"><h4>${i+1}. ${x.q}</h4><label><input type="radio" name="q${i}" value="a"> ${x.a}</label><br><label><input type="radio" name="q${i}" value="b"> ${x.b}</label><br><label><input type="radio" name="q${i}" value="c"> ${x.c}</label></div>`});document.getElementById('studentArea').innerHTML=h;document.getElementById('submitBtn').style.display="block"}
function submit(){let d=JSON.parse(localStorage.getItem('podclass_quizData')||'[]');let s=0;d.forEach((x,i)=>{if(document.querySelector(`input[name="q${i}"]:checked`)?.value===x.ans)s++});localStorage.setItem('podclass_quizScore',s);document.getElementById('score').innerText=`Score: ${s}/${d.length}`;document.getElementById('result').style.display="block"}render()</script></body></html>
