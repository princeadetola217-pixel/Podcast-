<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzes - PodClass 300L</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="header-top"><img src="https://i.postimg.cc/3R0YhXkT/fuoye-logo.png" class="logo"><div><h3>300L ENGLISH QUIZ</h3></div></div>
<nav><a href="index.html">🏠 Home</a><a href="lessons.html">📖 Lessons</a><a href="podcasts.html">🎙️ Podcasts</a><a href="quizzes.html" class="active">📋 Quizzes</a><a href="progress.html">📊 Progress</a><a href="about.html">ℹ️ About</a></nav></header>

<section class="container">
  <h1>Post-Test Quiz</h1>
  <form id="quizForm">
    <div class="quiz-q"><p>1. Which is a Noun? </p><label><input type="radio" name="q1" value="a"> Run</label><label><input type="radio" name="q1" value="b"> School</label></div>
    <div class="quiz-q"><p>2. Past tense of "go" is?</p><label><input type="radio" name="q2" value="a"> Went</label><label><input type="radio" name="q2" value="b"> Gone</label></div>
    <div class="quiz-q"><p>3. "She sings beautifully". "Beautifully" is an?</p><label><input type="radio" name="q3" value="a"> Adverb</label><label><input type="radio" name="q3" value="b"> Adjective</label></div>
    <div class="quiz-q"><p>4. Choose correct sentence</p><label><input type="radio" name="q4" value="a"> I am going to market</label><label><input type="radio" name="q4" value="b"> I going to market</label></div>
    <button type="button" class="btn-primary" onclick="checkQuiz()">Submit Quiz</button>
  </form>
  <h2 id="score" style="margin-top:20px; color:#4f46e5;"></h2>
</section>
<script>
function checkQuiz(){
  let score = 0; if(document.querySelector('input[name="q1"]:checked')?.value=="b") score++;
  if(document.querySelector('input[name="q2"]:checked')?.value=="a") score++;
  if(document.querySelector('input[name="q3"]:checked')?.value=="a") score++;
  if(document.querySelector('input[name="q4"]:checked')?.value=="a") score++;
  document.getElementById('score').innerText = `Your Score: ${score}/4`;
  localStorage.setItem('podclassScore', score);
}
</script>
