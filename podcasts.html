<section class="container">
  <h1>Podcast Episodes for 300L</h1>
  
  <div class="podcast-card" id="ep1">
    <h3>🎙️ Episode 1: Parts of Speech</h3>
    <iframe src="PASTE_AUDIO_LINK_1" width="100%" height="120" frameborder="0" allow="autoplay"></iframe>
    <button class="btn-record" onclick="startRecording(this)">🔴 Record Yourself</button>
    <p class="record-status"></p>
  </div>

  <div class="podcast-card" id="ep2">
    <h3>🎙️ Episode 2: Tenses</h3>
    <iframe src="PASTE_AUDIO_LINK_2" width="100%" height="120" frameborder="0" allow="autoplay"></iframe>
    <button class="btn-record" onclick="startRecording(this)">🔴 Record Yourself</button>
    <p class="record-status"></p>
  </div>
</section>

<script>
let mediaRecorder; let audioChunks = [];
async function startRecording(btn){
  const status = btn.nextElementSibling;
  if(btn.innerText.includes("Record")){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.start();
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, {type: 'audio/webm'});
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = document.createElement('audio');
        audio.controls = true; audio.src = audioUrl;
        status.innerHTML = "✅ Your Recording: <br>"; status.appendChild(audio);
      };
      btn.innerText = "⏹️ Stop Recording"; btn.style.background = "red";
      status.style.color = "orange";
      status.innerText = "Recording... Speak now";
    } catch(err){
      status.style.color = "red";
      status.innerText = "Mic Blocked! Go to Chrome Settings > Site Settings > Microphone > Allow for this site";
    }
  } else {
    mediaRecorder.stop();
    btn.innerText = "🔴 Record Again"; btn.style.background = "#4f46e5";
  }
}
</script>
