<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Podcasts - PodClass</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f7f7ff;padding-bottom:80px}header{background:#7c3aed;color:white;padding:18px 15px;position:sticky;top:0}.school-name{font-size:14px;font-weight:800;text-align:center;text-transform:uppercase;margin-bottom:12px}nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}nav a{color:white;text-decoration:none;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,0.15);font-size:13px;font-weight:600}nav a.active{background:#4c1d95}.container{max-width:800px;margin:0 auto;padding:20px}h1{text-align:center;color:#7c3aed}.teacher-box{background:#ede9fe;padding:20px;border-radius:16px;border:2px dashed #7c3aed;margin:20px 0}.input-group{margin:12px 0}.input-group input{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px}.btn{background:#7c3aed;color:white;border:none;padding:14px;border-radius:10px;width:100%;font-weight:700;cursor:pointer}.podcast-card{background:white;padding:20px;border-radius:18px;margin-bottom:18px;box-shadow:0 4px 15px rgba(0,0,0,0.06)}audio{width:100%;margin:12px 0}footer{background:#1e1e2d;color:white;text-align:center;padding:25px;font-size:13px;margin-top:30px}</style></head><body>
<header><div class="school-name">FEDERAL UNIVERSITY OYE-EKITI</div><nav><a href="index.html">🏠 Home</a><a href="lessons.html">📖 Lessons</a><a href="podcasts.html" class="active">🎙️ Podcasts</a><a href="quizzes.html">📋 Quizzes</a><a href="progress.html">📊 Progress</a></nav></header>
<div class="container"><h1>🎙️ Podcasts</h1>
<div class="teacher-box"><h3>👩‍🏫 Teacher Upload Podcast</h3><div class="input-group"><input type="text" id="podTitle" placeholder="Podcast Title"></div><div class="input-group"><input type="text" id="podDesc" placeholder="Description"></div><div class="input-group"><input type="file" id="podFile" accept=".mp3,.wav"></div><button class="btn" onclick="uploadPod()">📤 Upload Podcast</button></div>
<div id="podList"></div></div>
<footer><b>👤 ADEBISI TAIWO LATIFAT</b> Researcher<br><b>👥 DR. ADEGBOYEGA, S.M.</b> Supervisor</footer>
<script>function uploadPod(){const t=document.getElementById('podTitle').value;const d=document.getElementById('podDesc').value;const f=document.getElementById('podFile').files[0];if(!t||!d||!f){alert("Fill all fields");return}const url=URL.createObjectURL(f);let pods=JSON.parse(localStorage.getItem('podclass_pods')||'[]');pods.unshift({t,d,url});localStorage.setItem('podclass_pods',JSON.stringify(pods));localStorage.setItem('podclass_podcasts',pods.length);loadPods()}
function loadPods(){let pods=JSON.parse(localStorage.getItem('podclass_pods')||'[]');let html="";pods.forEach(p=>{html+=`<div class="podcast-card"><h3 style="color:#7c3aed">${p.t}</h3><p>${p.d}</p><audio controls src="${p.url}"></audio></div>`});document.getElementById('podList').innerHTML=html}loadPods()</script></body></html>
